<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top rim subtle light gradient -->
    <linearGradient id="rimGradient" x1="256" y1="14" x2="256" y2="498" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d2e9f3"/>
      <stop offset="20%" stop-color="#a2c5d8"/>
      <stop offset="60%" stop-color="#5a6570"/>
      <stop offset="100%" stop-color="#42464b"/>
    </linearGradient>

    <!-- Inner screen subtle depth -->
    <linearGradient id="screenFill" x1="256" y1="64" x2="256" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#282828"/>
      <stop offset="100%" stop-color="#232323"/>
    </linearGradient>
  </defs>

  <!-- Outer Highlight Rim -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#rimGradient)"/>

  <!-- Solid Black Bezel -->
  <rect x="28" y="28" width="456" height="456" rx="102" fill="#030102"/>

  <!-- Terminal Screen Surface -->
  <rect x="64" y="64" width="384" height="384" rx="68" fill="url(#screenFill)"/>

  <!-- Inner subtle screen border -->
  <rect x="64" y="64" width="384" height="384" rx="68" stroke="#383838" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- 'r' prompt glyph (crisp geometric monospaced) -->
  <path d="
    M 122 136
    H 143
    V 159
    C 152 143 167 135 185 135
    C 196 135 205 138 211 143
    L 201 162
    C 196 158 189 155 182 155
    C 165 155 151 167 143 182
    V 224
    H 122
    Z" fill="#FFFFFF"/>

  <!-- '_' cursor glyph (aligned to terminal baseline) -->
  <rect x="224" y="234" width="76" height="16" fill="#FFFFFF"/>
</svg>
